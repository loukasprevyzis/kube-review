name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

      - name: kube-review dogfood
        run: go run . review examples --fail-on NONE --output json

      - name: generate SARIF report
        run: go run . review examples --fail-on NONE --output sarif > kube-review.sarif

      - uses: actions/upload-artifact@v7
        with:
          name: kube-review-sarif
          path: kube-review.sarif
